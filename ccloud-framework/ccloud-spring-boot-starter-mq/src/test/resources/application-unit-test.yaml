spring:
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:h2:mem:ccloud_mq;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
          driver-class-name: org.h2.Driver
          username: sa
          password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - com.ccloud.framework.redis.config.CcloudRedisAutoConfiguration
      - com.ccloud.framework.redis.config.CcloudCacheAutoConfiguration

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto

ccloud:
  mybatis:
    encrypt-key: ccloud1234567890
