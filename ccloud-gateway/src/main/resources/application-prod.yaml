# 生产环境：跨域来源必须显式配置，不提供默认值
spring:
  config:
    # 在 profile 文件中导入：导入的配置优先于导入它的文件。写在 application.yaml 里时，
    # profile 文件会反过来覆盖 Nacos，控制台改的值对 profile 中已有的键不生效
    import:
      - optional:nacos:ccloud-common.yaml
      - optional:nacos:${spring.application.name}.yaml

ccloud:
  swagger:
    enable: false
  gateway:
    cors:
      allowed-origin-patterns: ${CCLOUD_CORS_ALLOWED_ORIGIN_PATTERNS}

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log
  level:
    com.ccloud: info
