# 网关测试配置：不连 Nacos，下游实例由测试经 simple discovery 注入
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    service-registry:
      auto-registration:
        enabled: false

ccloud:
  security:
    internal-sign-secret: unit-test-secret
  open:
    # 与默认一致，写出来便于阅读
    app-cache-ttl: 60s
  gateway:
    rate-limit:
      routes:
        promotion:
          replenish-rate: 1
          burst-capacity: 2
