# ccloud-member-server 基础配置。与环境无关的项放这里，环境相关项放 application-{profile}.yaml。
# Nacos 中的 ccloud-common.yaml / ccloud-datasource.yaml / ccloud-member-server.yaml 优先级高于本文件。
server:
  port: 48083

spring:
  application:
    name: ccloud-member-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-circular-references: false
  config:
    import:
      - optional:nacos:ccloud-common.yaml
      - optional:nacos:ccloud-datasource.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        metadata:
          # 供 Spring Boot Admin 发现 actuator 端点
          management.context-path: /actuator
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
  jackson:
    serialization:
      write-dates-as-timestamps: true
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  cache:
    type: redis
    redis:
      time-to-live: 1h
  datasource:
    dynamic:
      primary: master
      strict: false
  boot:
    admin:
      client:
        enabled: ${SBA_ENABLED:true}
        url: http://${SBA_HOST:127.0.0.1}:48182
        instance:
          prefer-ip: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ccloud.module.member.dal.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  info:
    env:
      enabled: true
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:127.0.0.1}:9411/api/v2/spans

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:true}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: http://${XXL_JOB_HOST:127.0.0.1}:48180/xxl-job-admin
    executor:
      appname: ${spring.application.name}
      port: 0
      log-path: ${user.home}/logs/xxl-job/${spring.application.name}
      log-retention-days: 30

ccloud:
  security:
    # 网关与各服务共享的内部签名密钥，必须通过环境变量或 Nacos 注入，缺失时所有内部身份均被拒绝
    internal-sign-secret: ${CCLOUD_INTERNAL_SIGN_SECRET:}
  mybatis:
    # 字段加密（EncryptTypeHandler）密钥，16 位
    encrypt-key: ${CCLOUD_ENCRYPT_KEY:ccloud1234567890}
  swagger:
    title: ccloud 会员服务
    description: C 端用户与认证、收件地址、等级、积分、经验
    version: 1.0.0
  xss:
    enable: true
  i18n:
    default-locale: zh_CN
  member:
    auth:
      # 密码登录连续失败达到次数后锁定该手机号，锁定时长单位分钟
      login-fail-limit: 5
      login-fail-lock-minutes: 10
      # 已开通的 C 端功能，经 /app-api/member/auth/get-permission-info 下发，前端据此显示入口
      features: point,sign-in,address
  tenant:
    enable: true
    # 租户校验结果本地缓存时长：每个请求都要经 RPC 校验租户，缓存期内租户状态变更不会立即生效
    valid-cache-duration: 1m
    # 不含 tenant_id 列的全局表，与 sql/mysql/ddl 保持一致（由 MemberServerApplicationTest 校验；与 system 共用一个库）
    ignore-tables:
      - system_menu
      - system_tenant
      - system_tenant_package
      - system_dict_type
      - system_dict_data
      - system_oauth2_client
      - system_sms_channel
      - system_sms_template
      - system_mail_account
      - system_mail_template
      - system_notify_template
      - system_i18n_message
      - infra_config
      - infra_file_config
      - infra_file_content
      - infra_job
      - infra_job_log
      - infra_codegen_table
      - infra_codegen_column
      - infra_data_source_config
      - infra_message_consume_log
      - open_api

debug: false
