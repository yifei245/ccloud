# 本地开发：直连本机 MySQL / Redis，Nacos 不可用时 optional 导入会跳过。
spring:
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        validation-query: SELECT 1
        test-while-idle: true
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/ccloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:root123}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

ccloud:
  security:
    internal-sign-secret: ${CCLOUD_INTERNAL_SIGN_SECRET:ccloud-local-internal-sign-secret}
  swagger:
    expose-rpc: true

xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}

logging:
  level:
    com.ccloud.module.system.dal.mysql: debug
