# ccloud 中间件：MySQL、Redis、Nacos、Zipkin、XXL-Job 调度中心。
# 单独启动：docker compose -f docker-compose.middleware.yml up -d（本机运行应用时使用）
# 端口只绑定 127.0.0.1，开发环境的默认密码不暴露到局域网
name: ccloud

services:
  ccloud-mysql:
    image: mysql:8.4
    container_name: ccloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
      # 供 04-ccloud-init.sh 写入 XXL-Job 管理员密码
      XXL_JOB_ADMIN_PASSWORD: ${XXL_JOB_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - ccloud-mysql-data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/ccloud.cnf:ro
      # ccloud 全量脚本直接挂载仓库中由 scripts/build-sql.sh 生成的文件，不另存副本以免与之不一致
      - ../sql/mysql/ccloud.sql:/docker-entrypoint-initdb.d/01-ccloud.sql:ro
      - ./mysql/init/02-nacos.sql:/docker-entrypoint-initdb.d/02-nacos.sql:ro
      - ./mysql/init/03-xxl-job.sql:/docker-entrypoint-initdb.d/03-xxl-job.sql:ro
      - ./mysql/init/04-ccloud-init.sh:/docker-entrypoint-initdb.d/04-ccloud-init.sh:ro
    healthcheck:
      # 走 TCP：初始化期间的临时实例只监听 socket，此时不会误判为就绪
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  ccloud-redis:
    image: redis:7-alpine
    container_name: ccloud-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - ccloud-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ccloud-nacos:
    image: nacos/nacos-server:v3.2.4-slim
    container_name: ccloud-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ccloud-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_CONSOLE_PORT: 8080
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "127.0.0.1:${NACOS_PORT}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT}:9848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT}:8080"
    depends_on:
      ccloud-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v3/admin/core/state/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 按 .env 的 NACOS_PASSWORD 初始化 Nacos 管理员账号（已存在时跳过），再导入 nacos/config 下的配置包
  # （已存在的 dataId 跳过，不覆盖控制台改过的值），完成后退出。应用等它成功退出后才启动
  ccloud-nacos-init:
    image: nacos/nacos-server:v3.2.4-slim
    container_name: ccloud-nacos-init
    restart: "no"
    environment:
      NACOS_SERVER: http://ccloud-nacos:8848/nacos
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_CONFIG_DIR: /init/config
    entrypoint: ["/bin/bash", "/init/nacos-init.sh"]
    volumes:
      - ./nacos/nacos-init.sh:/init/nacos-init.sh:ro
      - ../scripts/nacos-import.sh:/init/nacos-import.sh:ro
      - ./nacos/config:/init/config:ro
    depends_on:
      ccloud-nacos:
        condition: service_healthy

  ccloud-zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: ccloud-zipkin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZIPKIN_PORT}:9411"
    healthcheck:
      test: ["CMD", "docker-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ccloud-xxl-job:
    image: xuxueli/xxl-job-admin:3.4.2
    # 官方镜像只提供 amd64，Apple 芯片上经模拟运行
    platform: linux/amd64
    container_name: ccloud-xxl-job
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 3.4.x 默认上下文路径为 /，这里固定为 /xxl-job-admin，与各服务的 xxl.job.admin.addresses 一致
      PARAMS: >-
        --server.port=48180
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://ccloud-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN}
    ports:
      - "127.0.0.1:${XXL_JOB_PORT}:48180"
    depends_on:
      ccloud-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:48180/xxl-job-admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  ccloud-mysql-data:
  ccloud-redis-data:
