# ccloud 应用编排：gateway / system / member / monitor。中间件使用本机已有的实例（见 scripts/lib/local-middleware.sh），
# 经 host.docker.internal 访问；本机没有中间件时可先用 docker-compose.middleware.yml 自带一套，并相应调整 .env。
# 启动：scripts/docker-up.sh（检查本机中间件、初始化 ccloud 库与 Nacos 配置、打包、构建镜像并启动）
name: ccloud

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: dev
  TZ: Asia/Shanghai
  JAVA_OPTS: ${JAVA_OPTS}
  NACOS_ADDR: ${MIDDLEWARE_HOST}:${NACOS_PORT}
  NACOS_USERNAME: ${NACOS_USERNAME}
  NACOS_PASSWORD: ${NACOS_PASSWORD}
  NACOS_NAMESPACE: ${NACOS_NAMESPACE}
  MYSQL_HOST: ${MIDDLEWARE_HOST}
  MYSQL_PORT: ${MYSQL_PORT}
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
  REDIS_HOST: ${MIDDLEWARE_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DATABASE: ${REDIS_DATABASE}
  CCLOUD_INTERNAL_SIGN_SECRET: ${CCLOUD_INTERNAL_SIGN_SECRET}
  CCLOUD_ENCRYPT_KEY: ${CCLOUD_ENCRYPT_KEY}
  CCLOUD_MONITOR_PASSWORD: ${CCLOUD_MONITOR_PASSWORD}
  XXL_JOB_ENABLED: "true"
  XXL_JOB_HOST: ${MIDDLEWARE_HOST}
  XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN}
  ZIPKIN_HOST: ${MIDDLEWARE_HOST}

# Linux 上 host.docker.internal 需要显式映射到宿主机；Docker Desktop 自带，映射也无害
x-app-hosts: &app-hosts
  - "host.docker.internal:host-gateway"

services:
  ccloud-system:
    build: ../ccloud-module-system/ccloud-module-system-biz
    image: ccloud/ccloud-system-server:1.0.0
    container_name: ccloud-system
    restart: unless-stopped
    environment: *app-env
    extra_hosts: *app-hosts
    ports:
      - "127.0.0.1:${SYSTEM_PORT}:48081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:48081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  ccloud-member:
    build: ../ccloud-module-member/ccloud-module-member-biz
    image: ccloud/ccloud-member-server:1.0.0
    container_name: ccloud-member
    restart: unless-stopped
    environment: *app-env
    extra_hosts: *app-hosts
    ports:
      - "127.0.0.1:${MEMBER_PORT}:48083"
    depends_on:
      # 启动时经 RPC 从 system 加载文案等数据
      ccloud-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:48083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  ccloud-gateway:
    build: ../ccloud-gateway
    image: ccloud/ccloud-gateway:1.0.0
    container_name: ccloud-gateway
    restart: unless-stopped
    environment: *app-env
    extra_hosts: *app-hosts
    # 网关是唯一对外入口
    ports:
      - "${GATEWAY_PORT}:48080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:48080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ccloud-monitor:
    build: ../ccloud-monitor
    image: ccloud/ccloud-monitor:1.0.0
    container_name: ccloud-monitor
    restart: unless-stopped
    environment: *app-env
    extra_hosts: *app-hosts
    ports:
      - "127.0.0.1:${MONITOR_PORT}:48182"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:48182/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
